<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
<title id="title">FPV GCS — схема підключення</title>
<desc id="desc">USB-пульт до Windows; Ethernet через наземний та віддалений Herelink до Raspberry Pi. Pi GPIO14 передає CRSF у ES900TX, далі ELRS до приймача та FC дрона. Аналогове відео повертається через VRX, C2U, Pi та Herelink до Windows.</desc>
<defs>
<marker id="rc" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#66e0b9" stroke-width="2"/></marker>
<marker id="video" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#64bdff" stroke-width="2"/></marker>
<marker id="net" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 1L7 4.5L0 8" fill="none" stroke="#9cacc3" stroke-width="1.6"/></marker>
<style>
text{font-family:'Segoe UI';fill:#edf4ff} .h{font-size:22px;font-weight:650}.body{font-size:18px;fill:#c6d3e5}.small{font-size:15px;fill:#9dacc3}.mono{font-family:Consolas;font-size:18px;fill:#c6d3e5}.section{font-size:17px;font-weight:700;letter-spacing:2px;fill:#9dacc3}.box{fill:#162437;stroke:#34465e;stroke-width:1.5}.rc{stroke:#66e0b9;stroke-width:3;fill:none;marker-end:url(#rc)}.video{stroke:#64bdff;stroke-width:3;fill:none;marker-end:url(#video)}.net{stroke:#9cacc3;stroke-width:2;fill:none;marker-start:url(#net);marker-end:url(#net)}
</style>
</defs>
<rect width="1800" height="1180" rx="24" fill="#0b1320"/>
<text x="50" y="66" font-size="36" font-weight="700">FPV GCS</text><text x="244" y="66" font-size="29" fill="#c6d3e5">Схема підключення</text>
<text x="50" y="104" class="body">Фізичні з’єднання та напрямки сигналів • конфігурація проєкту</text>
<line x1="1100" y1="62" x2="1145" y2="62" class="rc"/><text x="1161" y="69" class="small">Керування</text>
<line x1="1315" y1="62" x2="1360" y2="62" class="video"/><text x="1376" y="69" class="small">Відео</text>
<line x1="1500" y1="62" x2="1545" y2="62" class="net"/><text x="1560" y="69" class="small">Мережа</text>
<rect x="40" y="140" width="390" height="670" rx="18" fill="#101c2b"/>
<rect x="470" y="140" width="770" height="670" rx="18" fill="#101c2b"/>
<rect x="1280" y="140" width="480" height="670" rx="18" fill="#101c2b"/>
<text x="66" y="175" class="section">01 / ОПЕРАТОР</text>
<text x="496" y="175" class="section">02 / ВІДДАЛЕНИЙ РЕТРАНСЛЯТОР</text>
<text x="1306" y="175" class="section">03 / ДРОН</text>

<rect x="80" y="210" width="310" height="100" rx="12" class="box"/><text x="104" y="250" class="h">USB-пульт</text><text x="104" y="282" class="body">TX16S / USB Joystick</text>
<line x1="235" y1="310" x2="235" y2="410" class="rc"/><text x="253" y="367" class="body">USB data</text>
<rect x="80" y="410" width="310" height="155" rx="12" class="box"/><text x="104" y="450" class="h">ПК / FPV GCS</text><text x="104" y="485" class="mono">192.168.144.3/24</text><text x="104" y="519" class="body">Windows • Ethernet</text><text x="104" y="546" class="small">Приймає відео на UDP 5602</text>
<line x1="235" y1="565" x2="235" y2="670" class="net"/><text x="253" y="623" class="body">Ethernet</text>
<rect x="80" y="670" width="310" height="100" rx="12" class="box"/><text x="104" y="709" class="h">Herelink Ground</text><text x="104" y="744" class="mono">192.168.144.11</text>

<path d="M390 720H520" class="net" stroke-dasharray="7 7"/><text x="455" y="682" class="small" text-anchor="middle">RF</text><text x="455" y="794" class="small" text-anchor="middle">Herelink</text>
<rect x="520" y="670" width="290" height="100" rx="12" class="box"/><text x="544" y="709" class="h">Herelink Air</text><text x="544" y="744" class="mono">192.168.144.10</text>
<line x1="665" y1="565" x2="665" y2="670" class="net"/><text x="683" y="623" class="body">Ethernet</text>
<rect x="520" y="410" width="290" height="155" rx="12" class="box"/><text x="544" y="450" class="h">Raspberry Pi</text><text x="544" y="485" class="mono">192.168.144.20/24</text><text x="544" y="519" class="body">eth0 • USB • GPIO</text><text x="544" y="546" class="small">Приймає RC на UDP 14600</text>
<line x1="665" y1="410" x2="665" y2="310" class="rc"/><text x="685" y="350" class="body">CRSF</text><text x="685" y="377" class="small">GPIO14 / pin 8 → IN</text>
<rect x="520" y="210" width="290" height="100" rx="12" class="box"/><text x="544" y="250" class="h">ES900TX</text><text x="544" y="282" class="body">CRSF IN • антена</text>
<line x1="810" y1="260" x2="1320" y2="260" class="rc" stroke-dasharray="8 7"/><text x="1065" y="244" text-anchor="middle" class="body">Радіоканал ELRS</text>
<rect x="1320" y="210" width="400" height="100" rx="12" class="box"/><text x="1344" y="250" class="h">ELRS-приймач</text><text x="1344" y="282" class="body">Пара до ES900TX</text>
<line x1="1520" y1="310" x2="1520" y2="410" class="rc"/><text x="1540" y="354" class="body">CRSF / UART</text><text x="1540" y="381" class="small">TX приймача → RXn FC</text>
<rect x="1320" y="410" width="400" height="100" rx="12" class="box"/><text x="1344" y="450" class="h">Польотний контролер</text><text x="1344" y="484" class="body">FC • UART RXn • GND</text>

<rect x="1320" y="650" width="400" height="120" rx="12" class="box"/><text x="1344" y="689" class="h">FPV-камера + VTX</text><text x="1344" y="723" class="body">Аналоговий відеопередавач</text><text x="1344" y="751" class="small">Камера VIDEO OUT → VTX VIDEO IN</text>
<line x1="1320" y1="710" x2="1190" y2="710" class="video" stroke-dasharray="8 7"/><text x="1255" y="685" text-anchor="middle" class="small">RF</text>
<rect x="900" y="650" width="290" height="120" rx="12" class="box"/><text x="924" y="689" class="h">Відеоприймач / VRX</text><text x="924" y="723" class="body">Вихід VIDEO / CVBS</text><text x="924" y="751" class="small">Частота відповідає VTX</text>
<line x1="1045" y1="650" x2="1045" y2="530" class="video"/><text x="1065" y="582" class="body">CVBS + GND</text><text x="1065" y="609" class="small">Кабель відео</text>
<rect x="900" y="410" width="290" height="120" rx="12" class="box"/><text x="924" y="450" class="h">C2U / USB-захоплення</text><text x="924" y="484" class="body">VIDEO IN → USB OUT</text><text x="924" y="512" class="small">Аналогове відео → UVC</text>
<line x1="900" y1="470" x2="810" y2="470" class="video"/><text x="855" y="452" text-anchor="middle" class="small">USB</text>

<rect x="40" y="840" width="1720" height="110" rx="14" fill="#142538" stroke="#2d4964"/>
<text x="66" y="877" class="h">Два потоки через ту саму мережу Herelink</text>
<text x="66" y="914" font-size="21" fill="#66e0b9">RC: ПК → Pi 192.168.144.20:14600 / UDP</text>
<text x="930" y="914" font-size="21" fill="#64bdff">Відео: Pi → ПК 192.168.144.3:5602 / RTP H.264</text>
<rect x="40" y="975" width="840" height="155" rx="14" fill="#14221f" stroke="#304d43"/>
<text x="66" y="1013" class="h">Pi → ES900TX: сигнальні дроти</text>
<text x="66" y="1048" class="body">GPIO14 / TXD • фізичний pin 8 → CRSF IN модуля</text>
<text x="66" y="1078" class="body">GND • фізичний pin 6 → GND модуля</text>
<text x="66" y="1107" class="small">/dev/serial0 • 420000 baud • 8N1 • CRSF 50 Гц</text>
<rect x="905" y="975" width="855" height="155" rx="14" fill="#292319" stroke="#5b4b30"/>
<text x="931" y="1013" class="h">Живлення — окремо від сигнальних ліній</text>
<text x="931" y="1048" class="body">Pi, Herelink, ES900TX та відеопристрої живити за паспортом.</text>
<text x="931" y="1078" class="body">UART Pi: логіка 3,3 В. Не подавати 5 В на GPIO.</text>
<text x="931" y="1107" class="small">GND спільний у дротових з’єднаннях; ревізію CRSF IN звірити з модулем.</text>
<text x="50" y="1160" class="small">Гілка відео показана для аналогового тракту з C2U. Живлення та телеметрія FC на схемі не розведені.</text>
</svg>
